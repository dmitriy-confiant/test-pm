name: Receive cajs sync

on:
  repository_dispatch:
    types: [sync-from-workerclient]

jobs:
  apply-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up git config
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Create sync branch
        run: |
          BRANCH_NAME="sync/workerclient-${GITHUB_RUN_ID}"
          git checkout -b $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Process changed files
        run: |
          echo '${{ github.event.client_payload.file_data }}' > file_data.json

          for filename in $(echo '${{ github.event.client_payload.file_data }}' | jq -r 'keys[]'); do
            CONTENT=$(jq -r ".[\"$filename\"]" file_data.json)
            echo "$CONTENT" | base64 -d > "cef/cajs/$filename"
            echo "Processed file: $filename"
          done

      - name: Check for changes
        id: git-check
        run: |
          git add cef/cajs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          elseeceive
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          if [ "${{ github.event.client_payload.source_type }}" == "pr" ]; then
            COMMIT_MSG="Sync JS files from workerclient PR #${{ github.event.client_payload.source_number }}"
          else
            COMMIT_MSG="Sync JS files from workerclient new_cef branch"
          fi

          git commit -m "$COMMIT_MSG"
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.git-check.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.REPO_SYNC_PAT }}
          commit-message: Sync JS files from workerclient
          title: ${{ github.event.client_payload.source_title }} (sync from workerclient)
          body: |
            This PR syncs JavaScript files from the workerclient repository.

            These changes originated from ${{ github.event.client_payload.source_type == 'pr' && format('PR #{0}', github.event.client_payload.source_number) || 'a push to master' }} in the workerclient repository.

            Files synchronized:
            ```
            ${{ join(fromJSON(github.event.client_payload.changed_files), '
            ') }}
            ```
          branch: ${{ env.BRANCH_NAME }}
          base: main

      - name: PR Details
        if: steps.create-pr.outputs.pull-request-number
        run: |
          echo "Pull Request created: ${{ steps.create-pr.outputs.pull-request-url }}"
