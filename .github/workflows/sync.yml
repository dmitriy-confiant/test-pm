name: Sync Files to WorkerClient

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cef/cajs/cajs.js"
      - "cef/cajs/consentParsing.js"
      - "cef/cajs/emulateDeviceMotion.js"
      - "cef/cajs/emulateDeviceOrientation.js"
      - "cef/cajs/emulateTouch.js"
      - "cef/cajs/patch_js_objects.js"
      - "cef/cajs/polyfill-Intl.NumberFormat.js"
      - "cef/cajs/polyfill-ResizeObserver.js"
      - "cef/cajs/polyfill-lite.js"

jobs:
  sync-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    if: github.event.pull_request.state == 'open' && !contains(github.event.pull_request.title, '[AUTO-SYNC]')

    steps:
      - name: Checkout puppet-master repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v35
        with:
          files: |
            cef/cajs/cajs.js
            cef/cajs/consentParsing.js
            cef/cajs/emulateDeviceMotion.js
            cef/cajs/emulateDeviceOrientation.js
            cef/cajs/emulateTouch.js
            cef/cajs/patch_js_objects.js
            cef/cajs/polyfill-Intl.NumberFormat.js
            cef/cajs/polyfill-ResizeObserver.js
            cef/cajs/polyfill-lite.js

      - name: Checkout workerclient repo
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/checkout@v3
        with:
          repository: dmitriy-confiant/test-wc
          path: test-wc
          token: ${{ secrets.REPO_SYNC_PAT }}
          fetch-depth: 1

      - name: Set sync branch name
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "SYNC_BRANCH=sync-from-puppet-master-pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Check for existing PR
        if: steps.changed-files.outputs.any_changed == 'true'
        id: check-pr
        run: |
          cd test-wc
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          export GH_TOKEN="${{ secrets.REPO_SYNC_PAT }}"
          PR_EXISTS=$(gh pr list --repo dmitriy-confiant/test-wc --head ${{ env.SYNC_BRANCH }} --json number --jq length)

          if [ "$PR_EXISTS" -gt "0" ]; then
            echo "PR already exists for this branch."
            echo "pr_exists=true" >> $GITHUB_OUTPUT

            git fetch ${{ env.SYNC_BRANCH }}
            git checkout ${{ env.SYNC_BRANCH }}
          else
            echo "No existing PR found. Creating a new branch."
            echo "pr_exists=false" >> $GITHUB_OUTPUT

            git checkout -b ${{ env.SYNC_BRANCH }}
          fi

      - name: Copy changed files to workerclient
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed files:" > changed_files.txt

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            filename=$(basename "$file")
            echo "Copying $filename..." >> changed_files.txt
            cp "$file" "test-wc/cef_client/cajs/$filename"
          done

      - name: Update or create PR in workerclient
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd test-wc
          git add cef_client/cajs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Sync JS files from puppet-master PR #${{ github.event.pull_request.number }} (Commit: ${{ github.event.pull_request.head.sha }})"
          git push origin ${{ env.SYNC_BRANCH }} --force

          if [ "${{ steps.check-pr.outputs.pr_exists }}" == "true" ]; then
            echo "Updating existing PR with new changes"
          else
            echo "Creating new PR"
            gh pr create \
              --title "[AUTO-SYNC] Sync JS files from puppet-master PR #${{ github.event.pull_request.number }}" \
              --body "This PR syncs JS files from puppet-master PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})

              Changes include:
              $(cat ../changed_files.txt)" \
              --repo dmitriy-confiant/test-wc \
              --base main \
              --head ${{ env.SYNC_BRANCH }}
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_PAT }}
